name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      # Excludes the `live` and `e2e` markers via pyproject addopts,
      # so CI never touches the AIC API or a paid provider.
      - name: Test
        run: uv run pytest --cov=app --cov-report=term-missing
