name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to a branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        # --frozen: install exactly what uv.lock pins, and fail if it is stale,
        # rather than silently resolving something newer than what was tested.
        run: uv sync --extra dev --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      # Excludes the `live` and `e2e` markers via pyproject addopts,
      # so CI never touches the AIC API or a paid provider.
      - name: Test
        run: uv run pytest --cov=app --cov-report=term-missing
