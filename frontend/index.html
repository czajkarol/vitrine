<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vitrine</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main id="stage" class="stage">
    <!-- Two stacked blur layers; the crossfade swaps which one is on top. -->
    <div class="layer" id="layer-a"></div>
    <div class="layer" id="layer-b"></div>
    <img id="artwork" class="artwork" alt="">
  </main>

  <div id="status" class="status" role="status"></div>

  <!-- Metadata overlay. Hidden at rest, revealed by mouse movement, pinned by `I`.
       aria-live so a screen reader hears each new artwork announced. -->
  <footer id="overlay" class="overlay" aria-live="polite">
    <div class="overlay-panel">
      <!-- Museum facts. AI interpretation gets its own labelled container in M5 and must
           never share this one — a glance should never mistake generated text for a
           museum caption (docs/product-spec.md). -->
      <section class="facts">
        <h1 id="ov-title" class="ov-title"></h1>
        <p id="ov-artist" class="ov-artist"></p>
        <p id="ov-meta" class="ov-meta"></p>
        <p id="ov-description" class="ov-description"></p>
      </section>
      <p id="ov-credit" class="ov-credit"></p>
      <p id="ov-attribution" class="ov-attribution"></p>
    </div>
  </footer>

  <!-- Settings. Hidden and inert at rest; `S` opens it, Esc closes it.
       The English text below is what the browser paints before locales/ loads; every
       label carries a data-i18n key that replaces it. See js/i18n.js. -->
  <aside id="panel" class="panel" role="dialog" aria-modal="false"
         data-i18n-aria-label="settings_title" inert>
    <h2 class="panel-heading" data-i18n="settings_title">Settings</h2>

    <fieldset class="panel-group">
      <legend data-i18n="mode_legend">Mode</legend>
      <label class="panel-option">
        <input type="radio" name="mode" value="random" checked>
        <span data-i18n="mode_random_option">Random — anything in the collection</span>
      </label>
      <label class="panel-option">
        <input type="radio" name="mode" value="curated">
        <span data-i18n="mode_curated_option">Curated — ranked by transparent scoring</span>
      </label>
    </fieldset>

    <fieldset class="panel-group">
      <legend data-i18n="artwork_type_legend">Artwork type</legend>
      <p id="panel-summary" class="panel-summary"></p>
      <div id="panel-types" class="panel-options"></div>
    </fieldset>

    <!-- Removed outright where the Screen Wake Lock API is missing, rather than shown
         disabled: an inert toggle invites the user to wonder what they did wrong. -->
    <fieldset class="panel-group" id="panel-ambient-group">
      <legend data-i18n="ambient_legend">Ambient</legend>
      <label class="panel-option">
        <input type="checkbox" id="panel-ambient">
        <span data-i18n="ambient_label">Keep the screen awake</span>
      </label>
    </fieldset>

    <fieldset class="panel-group">
      <legend data-i18n="language_legend">Language</legend>
      <label class="panel-option">
        <input type="radio" name="language" value="en" checked>
        <!-- Language names stay in their own language in both locales: someone looking for
             Polish is looking for the word "Polski". -->
        <span data-i18n="language_en">English</span>
      </label>
      <label class="panel-option">
        <input type="radio" name="language" value="pl">
        <span data-i18n="language_pl">Polski</span>
      </label>
    </fieldset>

    <p class="panel-hint" data-i18n="panel_hint">Esc to close. Rotation is paused while this is open.</p>
  </aside>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
