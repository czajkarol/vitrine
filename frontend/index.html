<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitrine</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main id="stage" class="stage">
    <!-- Two stacked blur layers; the crossfade swaps which one is on top. -->
    <div class="layer" id="layer-a"></div>
    <div class="layer" id="layer-b"></div>
    <img id="artwork" class="artwork" alt="">
  </main>

  <div id="status" class="status" role="status"></div>

  <!-- Metadata overlay. Hidden at rest, revealed by mouse movement, pinned by `I`.
       aria-live so a screen reader hears each new artwork announced. -->
  <footer id="overlay" class="overlay" aria-live="polite">
    <div class="overlay-panel">
      <!-- Museum facts. AI interpretation gets its own labelled container in M5 and must
           never share this one — a glance should never mistake generated text for a
           museum caption (docs/product-spec.md). -->
      <section class="facts">
        <h1 id="ov-title" class="ov-title"></h1>
        <p id="ov-artist" class="ov-artist"></p>
        <p id="ov-meta" class="ov-meta"></p>
        <p id="ov-description" class="ov-description"></p>
      </section>
      <p id="ov-credit" class="ov-credit"></p>
      <p id="ov-attribution" class="ov-attribution"></p>
    </div>
  </footer>

  <!-- Settings. Hidden and inert at rest; `S` opens it, Esc closes it. -->
  <aside id="panel" class="panel" role="dialog" aria-modal="false" aria-label="Settings" inert>
    <h2 class="panel-heading">Settings</h2>

    <fieldset class="panel-group">
      <legend>Mode</legend>
      <label class="panel-option">
        <input type="radio" name="mode" value="random" checked>
        <span>Random — anything in the collection</span>
      </label>
      <label class="panel-option">
        <input type="radio" name="mode" value="curated">
        <span>Curated — ranked by transparent scoring</span>
      </label>
    </fieldset>

    <fieldset class="panel-group">
      <legend>Artwork type</legend>
      <p id="panel-summary" class="panel-summary"></p>
      <div id="panel-types" class="panel-options"></div>
    </fieldset>

    <p class="panel-hint">Esc to close. Rotation is paused while this is open.</p>
  </aside>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
