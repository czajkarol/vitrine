[project]
name = "vitrine"
version = "0.1.0"
description = "Ambient digital-art display for artworks from the Art Institute of Chicago"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]
e2e = ["playwright>=1.49", "pytest-playwright>=0.6"]
ai = ["openai>=1.57", "anthropic>=0.40", "google-genai>=0.3"]
keyring = ["keyring>=25.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# ruff 0.16 began formatting Python blocks embedded in Markdown. The snippets in
# docs/ are illustrative and hand-aligned for reading, not code that has to compile.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle, pyflakes
    "I",               # isort
    "N",               # pep8-naming
    "UP",              # pyupgrade
    "B",               # bugbear
    "A",               # builtins shadowing
    "C4",              # comprehensions
    "SIM",             # simplify
    "TID",             # tidy imports
    "PTH",             # use pathlib
    "RUF",
]
ignore = ["B008"]      # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Enforces the layer boundary from docs/architecture.md.
"httpx".msg = "Only app/providers/ may import httpx. Domain logic must stay I/O-free."

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live and not e2e' --strict-markers"
markers = [
    "live: hits the real AIC API or a paid AI provider; run manually, never in CI",
    "e2e: Playwright browser tests; requires a running server",
]
